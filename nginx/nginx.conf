
user nginx;
worker_processes auto;
worker_rlimit_nofile 1024;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octect-stream;

  error_log /var/log/nginx/error.log warn;
  access_log off;
 
  proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=frontend_cache:10m 
                     max_size=50m inactive=60m use_temp_path=off;
  server_tokens off;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
 
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 100;
  client_max_body_size 10M;
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 2 1k;

  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_disable "msie6";
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml application/atom+xml
             image/svg+xml text/x-js text/x-cross-domain-policy;

  upstream frontend {
    server frontend:80;
    keepalive 32;
  }

  # Include all server blocks
  include /etc/nginx/conf.d/*.conf;
}
