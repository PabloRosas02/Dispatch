set $frontend_sv http://frontend:80;
location / {
  proxy_pass $frontend_sv;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_cache frontend_cache;
  proxy_cache_valid 200 302 60m;

  proxy_buffering on;
  proxy_buffer_size 2k;
  proxy_buffers 4 2k;
  proxy_busy_buffers_size 4k;
  proxy_temp_file_write_size 4k;

  proxy_connect_timeout 30s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_cache_key "$scheme$request_method$host$request_uri";
  proxy_cache_valid 200 302 60m;
  proxy_cache_use_stale error timeout updating;
  error_page 502 503 504 = @fallback_dev;
  keepalive_timeout 65;
  keepalive_requests 100;
}

location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
  proxy_pass $frontend_sv;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;

  proxy_cache frontend_cache;

  proxy_cache_valid 200 1y;
  expires 1y;
  add_header Cache-Control "public, immutable";
  access_log off;

  keepalive_timeout 65;
  keepalive_requests 100;
  error_page 502 503 504 = @fallback_dev;
}

location @fallback_dev {
     # Apunta directamente al contenedor de desarrollo en su puerto de Vite
     proxy_pass http://frontend-dev:5173;

     proxy_http_version 1.1;
     proxy_set_header Upgrade $http_upgrade;
     proxy_set_header Connection 'upgrade';
     proxy_set_header Host $host;
     proxy_cache_bypass $http_upgrade;
 }

