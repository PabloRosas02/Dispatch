
server {
  listen 80;
  server_name _;

  error_log /var/log/nginx/fronend-error.log warn;
  access_log off;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-corss-origin" always;

  proxy_cache frontend_cache;
  proxy_cache_key "$scheme$request_method$host$request_uri";
  proxy_cache_valid 200 302 60m;
  proxy_cache_use_stale error timeout updating;

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache frontend_cache;
    proxy_cache_valid 200 302 60m;

    proxy_buffering on;
    proxy_buffer_size 2k;
    proxy_buffers 4 2k;
    proxy_busy_buffers_size 4k;
    proxy_temp_file_write_size 4k;
 
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_cache frontend_cache;

    proxy_cache_valid 200 1y;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
}
