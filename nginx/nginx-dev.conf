
#user nginx;
worker_processes auto;
worker_rlimit_nofile 1024;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octect-stream;

  error_log /var/log/nginx/error.log warn;
  # access_log off;
 
  proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=frontend_cache:10m 
                     max_size=50m inactive=60m use_temp_path=off;
  server_tokens off;
 
  sendfile on;
  tcp_nopush off;
  tcp_nodelay on;
  client_max_body_size 10M;
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 2 1k;

  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  gzip off;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_disable "msie6";
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml application/atom+xml
             image/svg+xml text/x-js text/x-cross-domain-policy;

  resolver 127.0.0.11 valid=30s;

  server {
    listen 80;
    server_name _;
 
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 
    proxy_cache frontend_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 302 60m;
    proxy_cache_use_stale error timeout updating;

    # Include all server blocks
    include /etc/nginx/conf.d/backend.conf;
    include /etc/nginx/conf.d/frontend-dev.conf;
  }
}
