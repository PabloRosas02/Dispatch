name: kinsfolk

x-frontend-base-build: &frontend-base-build
  context: ./frontEnd
  dockerfile: Dockerfile
  args:
    NODE_VERSION: ${NODE_VERSION}

x-frontend-base: &frontend-base
  env_file:
    - ./.env
  restart: unless-stopped
  depends_on:
    - backend
  networks:
    - internal-nw

x-main-proxy-base: &main-proxy-base
    image: nginx:alpine
    container_name: main-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/tmp/nginx_cache
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
    - extenal-nw
    - internal-nw

services:

  main-proxy:
    profiles: ["prod"]
    <<: *main-proxy-base
    depends_on:
      - frontend
  main-proxy-dev:
    profiles: ["dev"]
    <<: *main-proxy-base

  frontend-dev:
    profiles: ["dev"]
    build:
      <<: *frontend-base-build
      target: development
    container_name: page-dev
    ports:
        - "5173:5173"
    volumes:
      - ./frontEnd:/app
      - /app/node_modules
    <<: *frontend-base

  frontend:
    profiles: ["prod"]
    build:
      <<: *frontend-base-build
      target: production
    container_name: page-prod
    security_opt:
      - no-new-privileges:true
    <<: *frontend-base

  backend:
    build:
      context: ./backEnd
      dockerfile: Dockerfile
      target: backend-production
      args:
        NODE_VERSION: ${NODE_VERSION}
    container_name: backend
    restart: unless-stopped
    volumes:
      - backend_db:/app/db
    networks:
      - internal-nw

  ngrok-tunnel:
    profiles: ["prod"]
    image: ngrok/ngrok:alpine
    container_name: tunnel
    restart: unless-stopped
    command:
      - "http"
      - "main-proxy:80"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN}
    depends_on:
      - main-proxy
    networks:
      - extenal-nw

volumes:
  nginx_cache:
    driver: local
  backend_db:
    driver: local

networks:
  extenal-nw:
    driver: bridge
  internal-nw:
    driver: bridge
    internal: true
