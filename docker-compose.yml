name: kinsfolk

x-frontend-base-build: &frontend-base-build
  context: ./frontEnd
  dockerfile: Dockerfile
  args:
    NODE_VERSION: ${NODE_VERSION}

x-frontend-base: &frontend-base
  env_file:
    - ./.env
  restart: unless-stopped

x-main-proxy-base: &main-proxy-base
    image: nginx:alpine
    container_name: main-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/tmp/nginx_cache
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

services:

  main-proxy:
    profiles: ["prod"]
    depends_on:
      - frontend
    <<: *main-proxy-base
  main-proxy-dev:
    profiles: ["dev"]
    <<: *main-proxy-base

  frontend-dev:
    profiles: ["dev"]
    build:
      <<: *frontend-base-build
      target: development
    container_name: page-dev
    ports:
        - "5173:5173"
    volumes:
      - ./frontEnd:/app
      - /app/node_modules
    <<: *frontend-base

  frontend:
    profiles: ["prod"]
    build:
      <<: *frontend-base-build
      target: production
    container_name: page-prod
    security_opt:
      - no-new-privileges:true
    <<: *frontend-base

volumes:
  nginx_cache:
    driver: local
