server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|ogg|ogv|webm|htc|woff|woff2|tff)$ {
    access_log off;
    log_not_found off;
  }

}
